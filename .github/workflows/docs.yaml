name: docs
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pandoc/actions/setup@v1
      - run: uv sync --locked --group docs
      - name: Build documentation
        run: |
          uv run --group docs python -m ipykernel install --name volara_env --user
          uv run --group docs jupytext --to notebook examples/getting_started/basics.py
          uv run --group docs jupytext --to notebook examples/cremi/cremi.py
          cp -r examples docs/source
          uv run --group docs sphinx-build docs/source docs/build/html -b html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
