name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    name: py${{ matrix.python-version }} ${{ matrix.resolution }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python floor and the newest interpreter numba supports
        python-version: ["3.11", "3.13"]
        resolution: ["highest", "lowest-direct"]
        exclude:
          # lowest-direct on the newest interpreter: the llvmlite floor has no 3.13 wheels and its sdist does not build there
          - python-version: "3.13"
            resolution: lowest-direct
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --resolution ${{ matrix.resolution }}
      - name: tests
        run: |
          start=$(date +%s%N)
          uv run pytest --cov-report=xml
          echo "PYTEST_SECONDS=$(awk "BEGIN {print ($(date +%s%N) - $start) / 1e9}")" >> "$GITHUB_ENV"
      # The benchmark workflow publishes these numbers after this run completes.
      - if: github.event_name != 'pull_request' && matrix.python-version == '3.11' && matrix.resolution == 'highest'
        run: uv run python benchmarks/run.py --pytest-seconds "$PYTEST_SECONDS" --pytest-command "uv run pytest --cov-report=xml"
      - if: github.event_name != 'pull_request' && matrix.python-version == '3.11' && matrix.resolution == 'highest'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: benchmarks/output.json
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
  test-macos:
    name: ${{ matrix.os }} py3.12
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest --no-cov   # platform smoke test; the coverage floor is gated by the Linux matrix
