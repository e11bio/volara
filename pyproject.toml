[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools", "wheel"]

[project]
name = "volara"
description = "A package for common blockwise computations for large microscopy volumes."
authors = [
    { name = "William Patton", email = "wllmpttn24@gmail.com" },
    { name = "Arlo Sheridan", email = "arlo@e11.bio" },
    { name = "Jeff Rhoades", email = "jeffr@e11.bio" },
    { name = "Jakob Troidl", email = "jtroidl@g.harvard.edu" },
    { name = "Andrew Champion", email = "andrew.champion@gmail.com" },
]
license = { text = "MIT" }
readme = "README.md"
dynamic = ["version"]

classifiers = ["Programming Language :: Python :: 3"]
keywords = []
requires-python = ">=3.11"

dependencies = [
    "click>=8.0",
    # daisy v2 (Rust rewrite); 2.0.1 measures block resources process-wide
    "daisy>=2.0.1,<3",
    "funlib.geometry>=0.3",
    "funlib.persistence>=0.8.1",  # prepare_ds(sharding=) with a default inner chunk for any block size
    "funlib.math",
    "mwatershed>=0.5.2",
    "pydantic>=2.6.3",
    "numpy>=2.0",
    "numba>=0.59.0",
    # llvmlite (numba dep) dropped macOS x86_64 wheels after 0.45; avoid source builds
    "llvmlite<0.46,!=0.44.*; platform_machine == 'x86_64' and sys_platform == 'darwin'",
    "scipy>=1.15.3",
    "scikit-image>=0.25.2",
    "cloud-volume>=12.4.1",
    "polars>=1.31.0",
    "cloudpickle>=3.0",
    "psutil>=7.0.0",
    # every path field is a upath.UPath; local ones are pathlib.Paths, remote ones
    # carry their fsspec filesystem. >=0.3: remote classes are no longer Path subclasses.
    "universal-pathlib>=0.3",
    # not a direct dependency, but we have to specify
    # otherwise uv demands a --pre-release=allow flag
    "iohub>=0.3.0a5",
]

[project.optional-dependencies]
s3 = [
    "s3fs>=2026.1.0",
]

[project.urls]
Documentation = "https://e11bio.github.io/volara"
Source = "https://github.com/e11bio/volara"
Issues = "https://github.com/e11bio/volara/issues"

[dependency-groups]
# Installed by `uv sync` (PEP 735); not part of the published package.
# ruff and ty are pinned with == until uv.lock is committed: both change
# their rule sets between releases.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ty==0.0.96",
    "ruff==0.17.3",
    # tests seem to be failing because a dependency of ours fails
    # without some packages installed. Not used directly by volara.
    "pandas>=3.0.0",
]
docs = [
    "autodoc_pydantic>=2.0",
    "sphinx-autodoc-typehints>=2.0",
    "sphinx-click>=6.0",
    "myst-parser>=4.0",
    "jupyter-sphinx>=0.5",
    "matplotlib>=3.0",
    # pooch is currently unused, but deliberately retained: it is the intended
    # mechanism for fetching the CREMI sample at docs-build time instead of
    # tracking it in git (see issue #49). Do not sweep it as "unused".
    "pooch>=1.8",
    "funlib-show-neuroglancer>=0.2",
    "nbsphinx>=0.9.7",
    "jupytext>=1.16.7",
    "pydata-sphinx-theme",
]

[project.scripts]
volara-cli = "volara.cli:cli"

[project.entry-points."volara.blockwise_tasks"]
aff-agglom = "volara.blockwise:AffAgglom"
argmax = "volara.blockwise:Argmax"
distance-agglom = "volara.blockwise:DistanceAgglom"
extract-frags = "volara.blockwise:ExtractFrags"
graph-mws = "volara.blockwise:GraphMWS"
lut = "volara.blockwise:Relabel"
seeded-extract-frags = "volara.blockwise:SeededExtractFrags"
threshold = "volara.blockwise:Threshold"
clahe = "volara.blockwise:CLAHE"
lambda = "volara.blockwise:LambdaTask"

[tool.setuptools.dynamic]
version = { attr = "volara.__version__" }

[tool.setuptools.packages.find]
include = ["volara*"]

[tool.setuptools.package-data]
"volara" = ["py.typed"]

[tool.pytest.ini_options]
markers = [
    "slurm: test requires a real slurm installation (srun on PATH). Deselected by default; run with `-m slurm`.",
]
# Skip slurm-gated tests unless explicitly requested. The worker tests spoof the
# cluster binaries via PATH shims and so are NOT marked slurm -- they run everywhere.
addopts = "-m 'not slurm'"

[tool.ruff]
line-length = 88
extend-exclude = ["docs/build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # the formatter owns line length

[tool.ruff.lint.per-file-ignores]
"tutorials/**/*.py" = ["E402"]  # jupytext cells import mid-file
"examples/**/*.py" = ["E402"]
"__init__.py" = ["F401"]  # re-exports

[tool.ty.src]
include = ["volara", "tests"]
exclude = []  # only ever shrinks

[tool.ty.terminal]
# warn-level rules are recorded counters, not failures
error-on-warning = false

[tool.ty.rules]
# Task subclasses narrow base fields to Literal values (fit, read_write_conflict,
# block_timeout); ty reports that as invalid-mutable-override. Recorded as a
# warning to promote to error once the base fields are typed as the unions.
invalid-mutable-override = "warn"

[tool.coverage.run]
branch = true
source = ["volara"]

[tool.coverage.report]
# Floor measured from the first branch-enabled run; raise it when measured
# coverage is two or more points ahead, never lower it without saying why.
fail_under = 69
show_missing = true
skip_covered = true
