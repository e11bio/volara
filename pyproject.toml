[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools", "wheel"]

[project]
name = "volara"
description = "A package for common blockwise computations for large microscopy volumes."
authors = [
    { name = "William Patton", email = "wllmpttn24@gmail.com" },
    { name = "Arlo Sheridan", email = "arlo@e11.bio" },
]
license = { text = "MIT" }
readme = "README.md"
dynamic = ["version"]

classifiers = ["Programming Language :: Python :: 3"]
keywords = []
requires-python = ">=3.11"

dependencies = [
    "click>=8.0",
    # daisy v2 (Rust rewrite) -- pinned to the git v2.0 branch via
    # [tool.uv.sources] below until 2.0.0 is published to PyPI.
    "daisy>=2",
    "funlib.geometry>=0.3",
    "funlib.persistence>=0.7.0",
    "funlib.math",
    "mwatershed>=0.5.2",
    "pydantic>=2.6.3",
    "numba>=0.59.0",
    # llvmlite (numba dep) dropped macOS x86_64 wheels after 0.45; avoid source builds
    "llvmlite<0.46,!=0.44.*; platform_machine == 'x86_64' and sys_platform == 'darwin'",
    "scipy>=1.15.3",
    "scikit-image>=0.25.2",
    "cloud-volume>=12.4.1",
    "polars>=1.31.0",
    "cloudpickle>=3.0",
    "psutil>=7.0.0",
    # not a direct dependency, but we have to specify
    # otherwise uv demands a --pre-release=allow flag
    "iohub>=0.3.0a5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ty>=0.0.1a24",
    "ruff>=0.6",
]
docs = [
    "autodoc_pydantic>=2.0",
    "sphinx-autodoc-typehints>=2.0",
    "sphinx-material>=0.0.36",
    "sphinx-click>=6.0",
    "myst-parser>=4.0",
    "jupyter-sphinx>=0.5",
    "matplotlib>=3.0",
    "pooch>=1.8",
    "wget>=3.2",
    "funlib-show-neuroglancer>=0.2",
    "nbsphinx>=0.9.7",
    "jupytext>=1.16.7",
    "pydata-sphinx-theme",
]
s3 = [
    "s3fs>=2026.1.0",
]

# tests seem to be failing because a dependency of ours fails
# without some packages installed. These are not used directly
# by volara.
indirect = [
    "pandas>=3.0.0",
]

[tool.uv.sources]
# daisy v2.0.0 is not on PyPI yet; install the Rust-backed package from the
# funkelab/daisy v2.0 branch. The buildable pyproject (maturin) is at the repo
# ROOT (python-source = daisy-py/python), so NO #subdirectory is needed.
daisy = { git = "https://github.com/funkelab/daisy", branch = "v2.0" }

[project.scripts]
volara-cli = "volara.cli:cli"

[project.entry-points."volara.blockwise_tasks"]
aff-agglom = "volara.blockwise:AffAgglom"
argmax = "volara.blockwise:Argmax"
distance-agglom = "volara.blockwise:DistanceAgglom"
extract-frags = "volara.blockwise:ExtractFrags"
graph-mws = "volara.blockwise:GraphMWS"
lut = "volara.blockwise:Relabel"
seeded-extract-frags = "volara.blockwise:SeededExtractFrags"
threshold = "volara.blockwise:Threshold"
clahe = "volara.blockwise:CLAHE"
lambda = "volara.blockwise:LambdaTask"

[tool.setuptools.dynamic]
version = { attr = "volara.__version__" }

[tool.setuptools.packages.find]
include = ["volara*"]

[tool.setuptools.package-data]
"volara" = ["py.typed"]

[tool.ruff]
lint.select = ["F", "W", "I001"]

[tool.pytest.ini_options]
markers = [
    "slurm: test requires a real slurm installation (srun on PATH). Deselected by default; run with `-m slurm`.",
]
# Skip slurm-gated tests unless explicitly requested. The worker tests spoof the
# cluster binaries via PATH shims and so are NOT marked slurm -- they run everywhere.
addopts = "-m 'not slurm'"
